<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Five Nights at Freddy's World</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .glitch {
            position: absolute;
            background-image: url(resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.75;
            z-index: -1;
        }

        canvas {
            display: none;
            user-select: none;
        }

        #title {
            position: absolute;
            top: 10vh;
            left: 5vw;
            z-index: 1;
            height: 20vh;
        }

        #animatronic {
            position: absolute;
            top: -5vh;
            right: 7vw;
            height: 120vh;
        }

        .loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 12vh;
            z-index: 1;
            color: white;
            font-family: monospace;
            text-align: center;
            font-weight: lighter;
            width: 85vw;
        }

        .loader h1 {
            margin: 0;
            font-size: 5vw;
        }

        .loader hr{
            margin: 0;
            border: white solid 0.1vw;
            width: 0%;
        }

        .loader h2 {
            margin: 1vh 0;
            font-size: 1.4vw;
        }
    </style>
</head>

<body>
    <canvas id="MMFCanvas" width="800" height="480"> Your browser does not support Canvas, Please try again.</canvas>

        <img id="title" src="resources/title.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!--Made by irv77-->
<script>
    const parts = 20;
    let gametitle, runtimecanvas
    gametitle = document.title;
    runtimecanvas = "resources/fnafw.cch";
    // Prevents touchscreen move
    window.addEventListener("scroll", preventMotion, false);
    window.addEventListener("touchmove", preventMotion, false);
    function preventMotion(event) {
        window.scrollTo(0, 0);
        event.preventDefault();
        event.stopPropagation();
    }
    // Fullscreen Key
    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', (event) => {
        delete pressedKeys[event.key];
    });
    // -----------------
    window.onload = function () {
        const map = new Map();

        function updateProgress(text, percent) {
            document.title = percent + '% ' + gametitle
            document.getElementById('percentage').innerHTML = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').innerHTML = text;
        }

        async function intercept() {
            const ogfetch = window.fetch;
            window.fetch = async function (input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const fileName = input.split('/').pop();
                    if (map.has(fileName)) {
                        return ogfetch(map.get(fileName), init);
                    }
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (url.startsWith('resources/')) {
                    const fileName = url.split('/').pop();
                    if (map.has(fileName)) {
                        url = map.get(fileName);
                    }
                }
                return ogopen.apply(this, arguments);
            };

            const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
            for (const Tag of types) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: descriptor.get,
                        set: function (val) {
                            if (typeof val === 'string' && val.startsWith('resources/')) {
                                const fileName = val.split('/').pop();
                                if (map.has(fileName)) {
                                    val = map.get(fileName);
                                }
                            }
                            descriptor.set.call(this, val);
                        }
                    });
                }
            }
        }

        async function extract() {
            const res = await fetch("resources.zip");

            const contentLength = res.headers.get("Content-Length");
            const total = parseInt(contentLength, 10);
            const reader = res.body.getReader();
            let loaded = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                updateProgress('RETURNING GEARS...', Math.floor((loaded / total / 2) * 100));
            }

            const arrayBuffer = await new Blob(chunks).arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            const totalFiles = files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = zip.files[files[i]];
                const blob = await file.async("blob");
                const url = URL.createObjectURL(blob);
                map.set(files[i], url);
                updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
            }
        }

        async function wedone() {
            await extract();
            await intercept();

            const script = document.createElement('script');
            script.src = 'src/Runtime.js';
            script.onload = () => {
                new Runtime("MMFCanvas", runtimecanvas);
            };
            document.getElementById('MMFCanvas').style.display = 'block';
            document.getElementById('selection').style.display = 'none';
            document.title = gametitle;
            document.head.appendChild(script);
        }

        const originalFetch = window.fetch;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let totalSize = 0;
                let loadedSize = 0;
                Promise.all(fileParts.map(part =>
                    fetch(part, { method: 'HEAD' }).then(res => {
                        try {
                            if (!res.ok) throw new Error("Missing part: " + part);
                            return parseInt(res.headers.get("Content-Length") || "0", 10);
                        } catch (error) { document.getElementById('stage').innerHTML = "ERROR: MISSING FILE(S)..." }
                    })
                )).then(sizes => {
                    totalSize = sizes.reduce((a, b) => a + b, 0);
                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }

                        fetch(fileParts[index]).then((response) => {
                            if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                            return response.arrayBuffer();
                        }).then((data) => {
                            buffers.push(data);
                            loadedSize += data.byteLength;
                            updateProgress('LOCATING ARCHIVE...', Math.floor((loadedSize / totalSize / 2) * 100));
                            fetchPart(index + 1);
                        }).catch(reject);
                    }

                    fetchPart(0);
                }).catch(reject);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("src/resources.zip", 1, parts))
        ]).then(([resources]) => {
            window.fetch = async function (url, ...args) {
                if (url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                } else {
                    return originalFetch(url, ...args);
                }
            };
            wedone();
        });
    };
</script>
</html>

</div>

<script>
(function() {
  let activeRuntime = null;
  let liveIniObjects = [];

  // 1. HOOK INTO CLICKTEAM FUSION HTML5 RUNTIME IN REAL TIME
  const hookInterval = setInterval(() => {
    // Clickteam HTML5 exposes the canvas runtime via window.Runtime or Canvas objects
    if (window.Runtime && window.Runtime.rhApp) {
      activeRuntime = window.Runtime;
    } else {
      // Fallback scanner to grab CRunApp instance directly from global scope or canvas
      for (let key in window) {
        try {
          if (window[key] && window[key].rhApp && window[key].rhApp.gValues) {
            activeRuntime = window[key];
            break;
          }
        } catch (e) {}
      }
    }

    if (activeRuntime && activeRuntime.rhApp) {
      findLiveIniExtensions(activeRuntime.rhApp);
      document.getElementById('mod-status').textContent = "Live Runtime Hooked! Ready.";
      clearInterval(hookInterval);
    }
  }, 500);

  // Locate Clickteam's cached INI objects in active RAM so changes apply immediately without reload
  function findLiveIniExtensions(app) {
    liveIniObjects = [];
    if (!app.rhObjectList) return;
    for (let i = 0; i < app.rhObjectList.length; i++) {
      const obj = app.rhObjectList[i];
      if (obj && obj.roc && obj.ext && (obj.ext.ini || obj.ext.items || typeof obj.ext.setValue === 'function')) {
        liveIniObjects.push(obj.ext);
      }
    }
  }

  function getSavePrefix() {
    const slot = document.getElementById('mod-slot').value;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.includes('freddyw')) {
        const base = k.split('.');
        return `${base}.s${slot}.`;
      }
    }
    return `freddyw.s${slot}.`;
  }

  // Writes to BOTH localStorage AND Clickteam's active RAM cache simultaneously
  function injectLiveValue(key, val) {
    const slot = document.getElementById('mod-slot').value;
    const prefix = getSavePrefix();
    const globalBase = prefix.split('.');

    // 1. Update localStorage
    localStorage.setItem(prefix + key, val);
    localStorage.setItem(`${globalBase}.${key}`, val);

    // 2. Refresh object list in case frame changed
    if (activeRuntime && activeRuntime.rhApp) {
      findLiveIniExtensions(activeRuntime.rhApp);
    }

    // 3. Inject directly into Clickteam's live CRunIni RAM cache
    liveIniObjects.forEach(iniExt => {
      try {
        if (typeof iniExt.setValue === 'function') {
          iniExt.setValue(`s${slot}`, key, Number(val));
          iniExt.setValue('', key, Number(val));
        }
        if (iniExt.ini && iniExt.ini.sections) {
          if (!iniExt.ini.sections[`s${slot}`]) iniExt.ini.sections[`s${slot}`] = {};
          iniExt.ini.sections[`s${slot}`][key] = String(val);
        }
      } catch (e) {}
    });
  }

  // Trigger Clickteam's internal frame/party refresh flag if available
  function forceEngineSync() {
    if (!activeRuntime || !activeRuntime.rhApp) return;
    const app = activeRuntime.rhApp;
    // Re-evaluate frame events on next tick
    if (app.rhEvtProg) {
      app.rhEvtProg.rh2ActionOn = true;
    }
  }

  function setStatus(msg) {
    const el = document.getElementById('mod-status');
    el.textContent = msg;
    setTimeout(() => { el.textContent = "Live Runtime Hooked! Ready."; }, 2500);
  }

  window.toggleModMenu = function() {
    const body = document.getElementById('fnaf-mod-body');
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
  };

  // 1. ALL CHARACTERS (Live + Party Freeze Fix)
  window.unlockAllCharacters = function() {
    for (let i = 1; i <= 40; i++) {
      injectLiveValue(`${i}have`, '1');
      const currentLv = localStorage.getItem(getSavePrefix() + `${i}lv`);
      if (!currentLv || parseInt(currentLv) < 1) {
        injectLiveValue(`${i}lv`, '1');
      }
    }
    for (let p = 1; p <= 8; p++) {
      injectLiveValue(`p${p}`, p.toString());
    }
    forceEngineSync();
    setStatus("All 40 Characters injected LIVE!");
  };

  // 2. CHIPS & BYTES (Live)
  window.unlockChipsAndBytes = function() {
    for (let c = 1; c <= 21; c++) injectLiveValue(`c${c}`, '1');
    for (let b = 1; b <= 21; b++) injectLiveValue(`b${b}`, '1');
    injectLiveValue('tokens', '99999');
    forceEngineSync();
    setStatus("Chips, Bytes & Tokens injected LIVE!");
  };

  // 3. TROPHIES (Live)
  window.unlockAllTrophies = function() {
    for (let t = 1; t <= 9; t++) {
      injectLiveValue(`trophy${t}`, '1');
      injectLiveValue(`t${t}`, '1');
    }
    forceEngineSync();
    setStatus("All 9 Trophies injected LIVE!");
  };

  // 4. CLOCK ENDING (Live)
  window.unlockClockEnding = function() {
    for (let clk = 1; clk <= 5; clk++) {
      injectLiveValue(`clock${clk}`, '1');
    }
    injectLiveValue('clocks', '5');
    injectLiveValue('portal', '1');
    forceEngineSync();
    setStatus("Clock Ending flags injected LIVE!");
  };

  // 5. INSTANT WARP (Live X/Y Coordinate Injection)
  window.warpPlayer = function() {
    const areaId = document.getElementById('warp-location').value;
    const coords = {
      "1": { x: 1320, y: 1580, area: 1 }, // Fazbear Hills
      "2": { x: 2450, y: 1400, area: 2 }, // Choppy's Woods
      "3": { x: 850,  y: 620,  area: 3 }, // Dusting Fields
      "4": { x: 3100, y: 2100, area: 4 }, // Lilygear Lake
      "5": { x: 600,  y: 2400, area: 5 }, // Blacktomb Yard
      "6": { x: 1900, y: 2700, area: 6 }, // Deep-Metal Mine
      "7": { x: 2950, y: 800,  area: 7 }  // Pinwheel Circus
    };
    const dest = coords[areaId];
    if (!dest) return;

    injectLiveValue('x', dest.x.toString());
    injectLiveValue('y', dest.y.toString());
    injectLiveValue('area', dest.area.toString());

    // Directly move the active player sprite in the current overworld frame
    if (activeRuntime && activeRuntime.rhApp && activeRuntime.rhApp.rhObjectList) {
      const list = activeRuntime.rhApp.rhObjectList;
      for (let i = 0; i < list.length; i++) {
        const obj = list[i];
        // Identify overworld Freddy/player object by movement controller & overworld bounds
        if (obj && obj.roc && obj.roc.rcMovementType > 0 && obj.hoX > 100 && obj.hoY > 100) {
          obj.hoX = dest.x;
          obj.hoY = dest.y;
          obj.roc.rcChanged = true;
        }
      }
    }
    forceEngineSync();
    setStatus("Warped live! Open/close Party menu to sync map.");
  };
})();
</script>
