<script>
    const parts = 20;
    let gametitle, runtimecanvas
    gametitle = document.title;
    runtimecanvas = "resources/fnafw.cch";
    // Prevents touchscreen move
    window.addEventListener("scroll", preventMotion, false);
    window.addEventListener("touchmove", preventMotion, false);
    function preventMotion(event) {
        window.scrollTo(0, 0);
        event.preventDefault();
        event.stopPropagation();
    }
    // Fullscreen Key
    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', (event) => {
        delete pressedKeys[event.key];
    });
    // -----------------
    window.onload = function () {
        const map = new Map();

        function updateProgress(text, percent) {
            document.title = percent + '% ' + gametitle
            document.getElementById('percentage').innerHTML = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').innerHTML = text;
        }

        async function intercept() {
            const ogfetch = window.fetch;
            window.fetch = async function (input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const fileName = input.split('/').pop();
                    if (map.has(fileName)) {
                        return ogfetch(map.get(fileName), init);
                    }
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (url.startsWith('resources/')) {
                    const fileName = url.split('/').pop();
                    if (map.has(fileName)) {
                        url = map.get(fileName);
                    }
                }
                return ogopen.apply(this, arguments);
            };

            const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
            for (const Tag of types) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: descriptor.get,
                        set: function (val) {
                            if (typeof val === 'string' && val.startsWith('resources/')) {
                                const fileName = val.split('/').pop();
                                if (map.has(fileName)) {
                                    val = map.get(fileName);
                                }
                            }
                            descriptor.set.call(this, val);
                        }
                    });
                }
            }
        }

        async function extract() {
            const res = await fetch("resources.zip");

            const contentLength = res.headers.get("Content-Length");
            const total = parseInt(contentLength, 10);
            const reader = res.body.getReader();
            let loaded = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                updateProgress('RETURNING GEARS...', Math.floor((loaded / total / 2) * 100));
            }

            const arrayBuffer = await new Blob(chunks).arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            const totalFiles = files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = zip.files[files[i]];
                const blob = await file.async("blob");
                const url = URL.createObjectURL(blob);
                map.set(files[i], url);
                updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
            }
        }

        async function wedone() {
            await extract();
            await intercept();

            const script = document.createElement('script');
            script.src = 'src/Runtime.js';
            script.onload = () => {
                new Runtime("MMFCanvas", runtimecanvas);
            };
            document.getElementById('MMFCanvas').style.display = 'block';
            document.getElementById('selection').style.display = 'none';
            document.title = gametitle;
            document.head.appendChild(script);
        }

        const originalFetch = window.fetch;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let totalSize = 0;
                let loadedSize = 0;
                Promise.all(fileParts.map(part =>
                    fetch(part, { method: 'HEAD' }).then(res => {
                        try {
                            if (!res.ok) throw new Error("Missing part: " + part);
                            return parseInt(res.headers.get("Content-Length") || "0", 10);
                        } catch (error) { document.getElementById('stage').innerHTML = "ERROR: MISSING FILE(S)..." }
                    })
                )).then(sizes => {
                    totalSize = sizes.reduce((a, b) => a + b, 0);
                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }

                        fetch(fileParts[index]).then((response) => {
                            if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                            return response.arrayBuffer();
                        }).then((data) => {
                            buffers.push(data);
                            loadedSize += data.byteLength;
                            updateProgress('LOCATING ARCHIVE...', Math.floor((loadedSize / totalSize / 2) * 100));
                            fetchPart(index + 1);
                        }).catch(reject);
                    }

                    fetchPart(0);
                }).catch(reject);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("src/resources.zip", 1, parts))
        ]).then(([resources]) => {
            window.fetch = async function (url, ...args) {
                if (url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                } else {
                    return originalFetch(url, ...args);
                }
            };
            wedone();
        });
    };
</script>

<script>
(function() {
  let activeRuntime = null;
  let liveIniObjects = [];

  const AREA_COORDS = {
    "1": { area: 1, x: 1850, y: 2150 },
    "2": { area: 2, x: 1100, y: 2650 },
    "3": { area: 3, x: 1150, y: 1250 },
    "4": { area: 4, x: 2650, y: 2650 },
    "5": { area: 5, x: 2700, y: 1850 },
    "6": { area: 6, x: 2450, y: 1150 },
    "7": { area: 7, x: 3250, y: 1200 }
  };

  const BOSS_COORDS = {
    "auto":      { area: 2, x: 960,  y: 2480, bossId: 1, name: "Auto-Chipper" },
    "bouncer":   { area: 3, x: 980,  y: 1120, bossId: 2, name: "Bouncer" },
    "browboy":   { area: 4, x: 2820, y: 2460, bossId: 3, name: "Browboy" },
    "madendo":   { area: 5, x: 2850, y: 1700, bossId: 4, name: "Mad Endo" },
    "supergoon": { area: 6, x: 2300, y: 1020, bossId: 5, name: "Supergoon" },
    "security":  { area: 7, x: 3420, y: 980,  bossId: 6, name: "Security" },
    "scott":     { area: 7, x: 3560, y: 860,  bossId: 7, name: "Scott Cawthon" },
    "chica":     { area: 7, x: 3650, y: 780,  bossId: 8, name: "Chica's Rainbow" }
  };

  // 1. HOOK CLICKTEAM RUNTIME
  const hookInterval = setInterval(() => {
    if (window.Runtime && window.Runtime.rhApp) {
      activeRuntime = window.Runtime;
    } else {
      for (let key in window) {
        try {
          if (window[key] && window[key].rhApp && window[key].rhApp.gValues) {
            activeRuntime = window[key];
            break;
          }
        } catch (e) {}
      }
    }

    if (activeRuntime && activeRuntime.rhApp) {
      findLiveIniExtensions(activeRuntime.rhApp);
      document.getElementById('mod-status').textContent = "Runtime Hooked! Ready.";
      clearInterval(hookInterval);
    }
  }, 500);

  function findLiveIniExtensions(app) {
    liveIniObjects = [];
    if (!app.rhObjectList) return;
    for (let i = 0; i < app.rhObjectList.length; i++) {
      const obj = app.rhObjectList[i];
      if (obj && obj.roc && obj.ext && (obj.ext.ini || obj.ext.items || typeof obj.ext.setValue === 'function')) {
        liveIniObjects.push(obj.ext);
      }
    }
  }

  function getMatchingPrefixes(slot) {
    const prefixes = new Set([
      `fnafw${slot}.`,
      `fnafw${slot}.fnafw${slot}.`,
      `freddyw.s${slot}.`
    ]);

    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (k.includes(`fnafw${slot}`) || k.includes('freddyw')) {
        const lastDot = k.lastIndexOf('.');
        if (lastDot !== -1) {
          prefixes.add(k.substring(0, lastDot + 1));
        }
      }
    }
    return Array.from(prefixes);
  }

  function injectLiveValue(key, val) {
    const slot = document.getElementById('mod-slot').value;
    const prefixes = getMatchingPrefixes(slot);

    prefixes.forEach(prefix => {
      localStorage.setItem(prefix + key, String(val));
    });

    if (activeRuntime && activeRuntime.rhApp) {
      findLiveIniExtensions(activeRuntime.rhApp);
    }

    liveIniObjects.forEach(iniExt => {
      try {
        const sectionsToTry = [`fnafw${slot}`, `s${slot}`, ''];
        sectionsToTry.forEach(sec => {
          if (typeof iniExt.setValue === 'function') {
            iniExt.setValue(sec, key, Number(val));
          }
          if (iniExt.ini && iniExt.ini.sections) {
            if (!iniExt.ini.sections[sec]) iniExt.ini.sections[sec] = {};
            iniExt.ini.sections[sec][key] = String(val);
          }
        });
        if (typeof iniExt.saveIni === 'function') iniExt.saveIni();
      } catch (e) {}
    });
  }

  function moveOverworldPlayer(dest) {
    injectLiveValue('area', dest.area);
    injectLiveValue('x', dest.x);
    injectLiveValue('y', dest.y);

    if (activeRuntime && activeRuntime.rhApp && activeRuntime.rhApp.rhObjectList) {
      const app = activeRuntime.rhApp;
      for (let i = 0; i < app.rhObjectList.length; i++) {
        const obj = app.rhObjectList[i];
        if (obj && obj.roc && obj.rom && obj.rom.rmMovement && (obj.rom.rmMovement.mvType === 2 || obj.rom.rmMovement.mvType === 3)) {
          obj.hoX = dest.x;
          obj.hoY = dest.y;
          obj.roc.rcChanged = true;
        }
      }
      if (typeof app.setDisplay === 'function') {
        app.setDisplay(dest.x - 400, dest.y - 240, -1, -1);
      }
    }
  }

  function forceEngineSync() {
    if (!activeRuntime || !activeRuntime.rhApp) return;
    const app = activeRuntime.rhApp;
    if (app.rhEvtProg) {
      app.rhEvtProg.rh2ActionOn = true;
    }
  }

  function setStatus(msg) {
    const el = document.getElementById('mod-status');
    el.textContent = msg;
setTimeout(() => { el.textContent = "Runtime Hooked! Ready."; }, 3000);
}
// ON / OFF MENU TOGGLE

if (isOpen) {
menu.style.display = 'block';
btnOn.style.opacity = '1';
btnOff.style.opacity = '0.6';
} else {
menu.style.display = 'none';
btnOn.style.opacity = '0.85';
btnOff.style.opacity = '1';
}
};
// 1. ALL 48 CHARACTERS + PARTY SCREEN & CRYING CHILD ANTI-FREEZE
window.unlockAllCharacters = function() {
for (let i = 1; i <= 48; i++) {
injectLiveValue(${i}have, '1');
injectLiveValue(${i}lv, '25');
injectLiveValue(${i}level, '25');
injectLiveValue(${i}next, '0');
}
for (let p = 1; p <= 8; p++) {
injectLiveValue(p${p}, String(p));
injectLiveValue(s${p}, String(p));
}
injectLiveValue('newgame', '0');
forceEngineSync();
setStatus("All 48 Chars Unlocked! Re-open Party.");
};

window.unlockAllChips = function() {
for (let c = 1; c <= 21; c++) {
injectLiveValue(c${c}, '1');
}
forceEngineSync();
setStatus("All 21 Chips unlocked!");
};
// 3. ALL BYTES
window.unlockAllBytes = function() {
for (let b = 1; b <= 21; b++) {
injectLiveValue(b${b}, '1');
injectLiveValue(p${b}, '1');
}
forceEngineSync();
setStatus("All 21 Bytes unlocked!");
};
// 4. MAX LEVEL (LV. 999 FOR ALL 48 CHARACTERS)
window.setMaxLevel = function() {
for (let i = 1; i <= 48; i++) {
injectLiveValue(${i}lv, '999');
injectLiveValue(${i}level, '999');
injectLiveValue(${i}next, '0');
injectLiveValue(${i}xp, '9999999');
}
forceEngineSync();
setStatus("All 48 Chars set to Max Level (999)!");
};
// 5. 999,999 TOKENS
window.giveMaxTokens = function() {
injectLiveValue('tokens', '999999');
injectLiveValue('faztokens', '999999');
forceEngineSync();
setStatus("999,999 Tokens added!");
};
// 6. AREA WARP
window.warpToArea = function() {
const locKey = document.getElementById('warp-location').value;
const dest = AREA_COORDS[locKey];
if (!dest) return;
moveOverworldPlayer(dest);
forceEngineSync();
setStatus(Warped to Area ${dest.area}!);
};
// 7. BOSS WARP
window.warpToBoss = function() {
const bossKey = document.getElementById('boss-location').value;
const dest = BOSS_COORDS[bossKey];
if (!dest) return;
injectLiveValue(boss${dest.bossId}, '0');
moveOverworldPlayer(dest);
forceEngineSync();
setStatus(Warped to ${dest.name}!);
};
})();
