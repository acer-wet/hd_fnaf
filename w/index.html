<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's World</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .glitch {
            position: absolute;
            background-image: url(resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.75;
            z-index: -1;
        }

        canvas {
            display: none;
            user-select: none;
        }

        #title {
            position: absolute;
            top: 10vh;
            left: 5vw;
            z-index: 1;
            height: 20vh;
        }

        #animatronic {
            position: absolute;
            top: -5vh;
            right: 7vw;
            height: 120vh;
        }

        .loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 12vh;
            z-index: 1;
            color: white;
            font-family: monospace;
            text-align: center;
            font-weight: lighter;
            width: 85vw;
        }

        .loader h1 {
            margin: 0;
            font-size: 5vw;
        }

        .loader hr{
            margin: 0;
            border: white solid 0.1vw;
            width: 0%;
        }

        .loader h2 {
            margin: 1vh 0;
            font-size: 1.4vw;
        }
    </style>
</head>

<body>
    <canvas id="MMFCanvas" width="800" height="480"> Your browser does not support Canvas, Please try again.</canvas>
    <div class="selection" id="selection">
        <img id="title" src="resources/title.png">
        <img id="animatronic" src="resources/animatronic.png">
        <div class="loader">
            <h1 id="percentage">0%</h1>
            <hr id="bar">
            <h2 id="stage">STARTING UP...</h2>
        </div>
        <a href="https://discord.gg/xuu8TnSY4b">
            <div class="launcher-text"><img src="resources/launcher-text.png" style="width: 45vw;"></div>
        </a>
    </div>
    <div class="glitch"></div>
    <img src="resources/vignette.png" class="vignette">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
<!--Made by irv77-->
<script>
    const parts = 20;
    let gametitle, runtimecanvas
    gametitle = document.title;
    runtimecanvas = "resources/fnafw.cch";
    // Prevents touchscreen move
    window.addEventListener("scroll", preventMotion, false);
    window.addEventListener("touchmove", preventMotion, false);
    function preventMotion(event) {
        window.scrollTo(0, 0);
        event.preventDefault();
        event.stopPropagation();
    }
    // Fullscreen Key
    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', (event) => {
        delete pressedKeys[event.key];
    });
    // -----------------
    window.onload = function () {
        const map = new Map();

        function updateProgress(text, percent) {
            document.title = percent + '% ' + gametitle
            document.getElementById('percentage').innerHTML = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').innerHTML = text;
        }

        async function intercept() {
            const ogfetch = window.fetch;
            window.fetch = async function (input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const fileName = input.split('/').pop();
                    if (map.has(fileName)) {
                        return ogfetch(map.get(fileName), init);
                    }
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (url.startsWith('resources/')) {
                    const fileName = url.split('/').pop();
                    if (map.has(fileName)) {
                        url = map.get(fileName);
                    }
                }
                return ogopen.apply(this, arguments);
            };

            const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
            for (const Tag of types) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: descriptor.get,
                        set: function (val) {
                            if (typeof val === 'string' && val.startsWith('resources/')) {
                                const fileName = val.split('/').pop();
                                if (map.has(fileName)) {
                                    val = map.get(fileName);
                                }
                            }
                            descriptor.set.call(this, val);
                        }
                    });
                }
            }
        }

        async function extract() {
            const res = await fetch("resources.zip");

            const contentLength = res.headers.get("Content-Length");
            const total = parseInt(contentLength, 10);
            const reader = res.body.getReader();
            let loaded = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                updateProgress('RETURNING GEARS...', Math.floor((loaded / total / 2) * 100));
            }

            const arrayBuffer = await new Blob(chunks).arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            const totalFiles = files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = zip.files[files[i]];
                const blob = await file.async("blob");
                const url = URL.createObjectURL(blob);
                map.set(files[i], url);
                updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
            }
        }

        async function wedone() {
            await extract();
            await intercept();

            const script = document.createElement('script');
            script.src = 'src/Runtime.js';
            script.onload = () => {
                new Runtime("MMFCanvas", runtimecanvas);
            };
            document.getElementById('MMFCanvas').style.display = 'block';
            document.getElementById('selection').style.display = 'none';
            document.title = gametitle;
            document.head.appendChild(script);
        }

        const originalFetch = window.fetch;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let totalSize = 0;
                let loadedSize = 0;
                Promise.all(fileParts.map(part =>
                    fetch(part, { method: 'HEAD' }).then(res => {
                        try {
                            if (!res.ok) throw new Error("Missing part: " + part);
                            return parseInt(res.headers.get("Content-Length") || "0", 10);
                        } catch (error) { document.getElementById('stage').innerHTML = "ERROR: MISSING FILE(S)..." }
                    })
                )).then(sizes => {
                    totalSize = sizes.reduce((a, b) => a + b, 0);
                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }

                        fetch(fileParts[index]).then((response) => {
                            if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                            return response.arrayBuffer();
                        }).then((data) => {
                            buffers.push(data);
                            loadedSize += data.byteLength;
                            updateProgress('LOCATING ARCHIVE...', Math.floor((loadedSize / totalSize / 2) * 100));
                            fetchPart(index + 1);
                        }).catch(reject);
                    }

                    fetchPart(0);
                }).catch(reject);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("src/resources.zip", 1, parts))
        ]).then(([resources]) => {
            window.fetch = async function (url, ...args) {
                if (url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                } else {
                    return originalFetch(url, ...args);
                }
            };
            wedone();
        });
    };
</script>
</html>
<!-- FNaF World Live Mod v5.4 -->
<script>
(function() {
  const savedMods = JSON.parse(localStorage.getItem('fnafw_active_mods') || '{}');

  const isFnafSaveKey = function(key) {
    if (!key || key === 'fnafw_active_mods') return false;
    const k = key.toLowerCase();
    return k.includes('fnafw1') || k.includes('fnafw2') || k.includes('fnafw3') || k.includes('freddy1') || k.includes('freddy2') || k.includes('freddy3');
  };

  const getModEntries = function() {
    const entries = {};

    // 1. Characters Only
    if (savedMods.chars) {
      for (let i = 1; i <= 48; i++) {
        entries[i + 'have'] = '1';
        entries['have' + i] = '1';
      }
      for (let i = 1; i <= 8; i++) {
        entries['u' + i] = '1';
      }
    }

    // 2. Chips Only
    if (savedMods.chips) {
      for (let i = 1; i <= 21; i++) {
        entries['c' + i] = '1';
        entries['chip' + i] = '1';
      }
    }

    // 3. Bytes Only
    if (savedMods.bytes) {
      for (let i = 1; i <= 21; i++) {
        entries['p' + i] = '1';
        entries['byte' + i] = '1';
      }
    }

    // 4. Max Party Level
    if (savedMods.lvl) {
      for (let i = 1; i <= 48; i++) {
        entries[i + 'lv'] = '100';
        entries['lv' + i] = '100';
        entries[i + 'xp'] = '0';
        entries['xp' + i] = '0';
      }
    }

    // 5. Faz-Tokens
    if (savedMods.tokens) {
      entries['tokens'] = '99999';
    }

    // 6. Clocks & Trophies
    if (savedMods.clock) {
      for (let i = 1; i <= 5; i++) entries['clock' + i] = '1';
      for (let i = 1; i <= 9; i++) entries['trophy' + i] = '1';
      entries['portal'] = '1';
    }

    return entries;
  };

  const patchSaveData = function(raw) {
    if (!raw || typeof raw !== 'string') return raw;
    if (!Object.values(savedMods).some(Boolean)) return raw;

    const delimiter = raw.includes('{@24}') ? '{@24}' : '\r\n';
    const items = raw.split(delimiter);
    const existingKeys = new Set();
    const out = [];
    const modEntries = getModEntries();

    for (let i = 0; i < items.length; i++) {
      const part = items[i];
      if (part.includes('=') && !part.trim().startsWith('[')) {
        const idx = part.indexOf('=');
        const k = part.slice(0, idx).trim();
        existingKeys.add(k);
        if (Object.prototype.hasOwnProperty.call(modEntries, k)) {
          out.push(k + '=' + modEntries[k]);
          continue;
        }
      }
      out.push(part);
    }

    const modKeys = Object.keys(modEntries);
    for (let i = 0; i < modKeys.length; i++) {
      const k = modKeys[i];
      if (!existingKeys.has(k)) {
        out.push(k + '=' + modEntries[k]);
      }
    }

    return out.join(delimiter);
  };

  const applyToAllSlots = function() {
    let patchedCount = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (isFnafSaveKey(key)) {
        const current = localStorage.getItem(key);
        if (current !== null) {
          localStorage.setItem(key, patchSaveData(current));
          patchedCount++;
        }
      }
    }
    return patchedCount;
  };

  applyToAllSlots();

  let speedMultiplier = 1;
  const origRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(callback) {
    return origRAF(function(timestamp) {
      callback(timestamp);
      for (let i = 1; i < speedMultiplier; i++) {
        callback(timestamp + i * 16);
      }
    });
  };

  function initMenu() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:12px;right:12px;z-index:999999;font-family:sans-serif;font-size:12px';

    const toggle = document.createElement('button');
    toggle.innerText = 'Hide Mod Menu';
    toggle.style.cssText = 'background:#e94560;color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:bold;float:right;margin-bottom:6px';
    wrap.appendChild(toggle);

    const panel = document.createElement('div');
    panel.style.cssText = 'clear:both;width:285px;background:#1a1a2e;color:#fff;border:2px solid #e94560;border-radius:8px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,0.7)';
    panel.innerHTML =
      '<div style="font-weight:bold;font-size:14px;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:8px">FNaF World Live Mod v5.4</div>' +
      '<div style="display:flex;flex-direction:column;gap:5px">' +
        '<button id="m-chars" style="padding:6px;background:' + (savedMods.chars ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">Unlock All 48 Characters ' + (savedMods.chars ? '(ON)' : '') + '</button>' +
        '<button id="m-chips" style="padding:6px;background:' + (savedMods.chips ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">Unlock All Chips ' + (savedMods.chips ? '(ON)' : '') + '</button>' +
        '<button id="m-bytes" style="padding:6px;background:' + (savedMods.bytes ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">Unlock All Bytes ' + (savedMods.bytes ? '(ON)' : '') + '</button>' +
        '<button id="m-lvl" style="padding:6px;background:' + (savedMods.lvl ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">Max Party Level (Level 100) ' + (savedMods.lvl ? '(ON)' : '') + '</button>' +
        '<button id="m-tokens" style="padding:6px;background:' + (savedMods.tokens ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">99,999 Faz-Tokens ' + (savedMods.tokens ? '(ON)' : '') + '</button>' +
        '<button id="m-clock" style="padding:6px;background:' + (savedMods.clock ? '#2e7d32' : '#0f3460') + ';color:#fff;border:1px solid #444;cursor:pointer;border-radius:4px">Unlock Clocks & All Trophies ' + (savedMods.clock ? '(ON)' : '') + '</button>' +
        '<button id="m-speed" style="padding:6px;background:#533483;color:#fff;border:1px solid #666;cursor:pointer;border-radius:4px">Instant Speed Hack: 1x (Normal)</button>' +
        '<button id="m-inspect" style="padding:5px;background:#222;color:#aaa;border:1px solid #444;cursor:pointer;border-radius:4px;font-size:11px">Scan & View All Save Keys</button>' +
      '</div>' +
      '<div id="m-msg" style="margin-top:8px;color:#4ecca3;font-size:11px;line-height:1.35;max-height:110px;overflow-y:auto;word-break:break-all">Ready! Toggle cheats ON while on the Title Screen, then click Start -> Slot 1.</div>';
    wrap.appendChild(panel);
    document.body.appendChild(wrap);

    toggle.onclick = function() {
      const hidden = panel.style.display === 'none';
      panel.style.display = hidden ? 'block' : 'none';
      toggle.innerText = hidden ? 'Hide Mod Menu' : 'Show Mod Menu';
    };

    const toggleMod = function(modKey, btnId, label) {
      savedMods[modKey] = !savedMods[modKey];
      localStorage.setItem('fnafw_active_mods', JSON.stringify(savedMods));
      const btn = document.getElementById(btnId);
      btn.style.background = savedMods[modKey] ? '#2e7d32' : '#0f3460';
      btn.innerText = label + (savedMods[modKey] ? ' (ON)' : '');
      const count = applyToAllSlots();
      document.getElementById('m-msg').innerText = savedMods[modKey]
        ? label + ' ON! Patched ' + count + ' save file(s). Click Start -> Slot 1!'
        : label + ' turned OFF.';
    };

    document.getElementById('m-chars').onclick = function() { toggleMod('chars', 'm-chars', 'Unlock All 48 Characters'); };
    document.getElementById('m-chips').onclick = function() { toggleMod('chips', 'm-chips', 'Unlock All Chips'); };
    document.getElementById('m-bytes').onclick = function() { toggleMod('bytes', 'm-bytes', 'Unlock All Bytes'); };
    document.getElementById('m-lvl').onclick = function() { toggleMod('lvl', 'm-lvl', 'Max Party Level (Level 100)'); };
    document.getElementById('m-tokens').onclick = function() { toggleMod('tokens', 'm-tokens', '99,999 Faz-Tokens'); };
    document.getElementById('m-clock').onclick = function() { toggleMod('clock', 'm-clock', 'Unlock Clocks & All Trophies'); };

    document.getElementById('m-speed').onclick = function() {
      speedMultiplier = speedMultiplier === 1 ? 3 : speedMultiplier === 3 ? 5 : 1;
      document.getElementById('m-speed').innerText = 'Instant Speed Hack: ' + speedMultiplier + 'x';
      document.getElementById('m-msg').innerText = 'Game speed set to ' + speedMultiplier + 'x immediately!';
    };

    document.getElementById('m-inspect').onclick = function() {
      const allKeys = [];
      for (let i = 0; i < localStorage.length; i++) {
        allKeys.push(localStorage.key(i));
      }
      const match = allKeys.find(isFnafSaveKey);
      const preview = match ? localStorage.getItem(match) : 'No save file created yet';
      document.getElementById('m-msg').innerText = 'Keys: [' + allKeys.join(', ') + ']\n---\n' + preview;
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMenu);
  } else {
    initMenu();
  }
})();
</script>
