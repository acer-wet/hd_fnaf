<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's World</title>
    <link rel="icon" href="favicon.ico" />
    <style>
                #mod-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 10000;
            background: rgba(15, 15, 20, 0.85);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.7;
        }
        #mod-toggle:hover { opacity: 1; }

        #mod-menu {
            position: fixed;
            top: 48px;
            right: 12px;
            width: 240px;
            background: rgba(12, 12, 18, 0.94);
            color: #fff;
            border: 1px solid #00ff88;
            border-radius: 6px;
            padding: 12px;
            z-index: 10000;
            display: none;
            font-family: monospace;
        }
        #mod-menu h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #00ff88;
            border-bottom: 1px solid #2a2a38;
            padding-bottom: 6px;
        }
        .mod-btn {
            width: 100%;
            background: #1b1b26;
            color: #fff;
            border: 1px solid #333346;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
        }
        .mod-btn:hover {
            border-color: #00ff88;
            color: #00ff88;
        }
        #mod-status {
            margin-top: 6px;
            font-size: 11px;
            color: #aaa;
        }

        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        
                canvas {
            display: none;
            user-select: none;
        }

        .selection {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loader h1 {
            margin: 0;
            color: #fff;
            font-family: monospace;
            font-size: 28px;
            font-weight: normal;
        }
    </style>


</head>

<body>
    <canvas id="MMFCanvas" width="800" height="480">Your browser does not support Canvas, Please try again.</canvas>

    <button id="mod-toggle">[M] MODS</button>
    <div id="mod-menu">
        <h3>FNaF World Mods [M]</h3>
        <button class="mod-btn" onclick="modAddTokens(100)">+100 Faz Tokens</button>
        <button class="mod-btn" onclick="modLevelUpParty(5)">+5 Lvls (Active Party)</button>
        <button class="mod-btn" onclick="modUnlockAllChars()">Unlock All Characters</button>
        <button class="mod-btn" onclick="modMaxArmor()">Max Endo Upgrade</button>
        <button class="mod-btn" onclick="modToggleHardMode()">Toggle Hard Mode</button>
        <div id="mod-status">Walk in world first, click a mod, then reload save.</div>
    </div>

    <div class="selection" id="selection">
        <div class="loader">
            <h1 id="percentage">0%</h1>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        const parts = 20;
        const gametitle = document.title;
        const runtimecanvas = "resources/fnafw.cch";

        // Prevents touchscreen move
        window.addEventListener("scroll", preventMotion, false);
        window.addEventListener("touchmove", preventMotion, false);
        function preventMotion(event) {
            window.scrollTo(0, 0);
            event.preventDefault();
            event.stopPropagation();
        }

        // Keyboard shortcuts (- and = for fullscreen, M for Mod Menu)
        const pressedKeys = {};
        document.addEventListener('keydown', event => {
            pressedKeys[event.key] = true;
            if (event.key === 'm' || event.key === 'M') toggleModMenu();
            if (pressedKeys['-'] && pressedKeys['=']) {
                document.querySelector('canvas').requestFullscreen();
                delete pressedKeys[event.key];
            }
        });
        document.addEventListener('keyup', (event) => {
            delete pressedKeys[event.key];
        });

        // --- MOD MENU ---
        const modMenu = document.getElementById('mod-menu');
                // Stop Clickteam Runtime from blocking clicks on the Mod Menu
        ['mousedown', 'mouseup', 'click', 'pointerdown', 'pointerup', 'touchstart'].forEach(evt => {
                    const modToggle = document.getElementById('mod-toggle');
        const modMenu = document.getElementById('mod-menu');
        const modStatus = document.getElementById('mod-status');

        function toggleModMenu() {
            modMenu.style.display = modMenu.style.display === 'block' ? 'none' : 'block';
        }
        modToggle.addEventListener('click', toggleModMenu);

        ['mousedown', 'mouseup', 'click', 'pointerdown', 'pointerup', 'touchstart'].forEach(evt => {
            modToggle.addEventListener(evt, e => e.stopPropagation());
            modMenu.addEventListener(evt, e => e.stopPropagation());
        });

            modToggle.addEventListener(evt, e => e.stopPropagation());
            modMenu.addEventListener(evt, e => e.stopPropagation());
        });

        const modStatus = document.getElementById('mod-status');

        function toggleModMenu() {
            modMenu.style.display = modMenu.style.display === 'block' ? 'none' : 'block';
        }
        document.getElementById('mod-toggle').addEventListener('click', toggleModMenu);

                              function getActiveSaveKey() {
            const keys = Object.keys(localStorage).filter(k => /fnafw[1-3]/i.test(k));
            if (!keys.length) return null;
            const slot1 = keys.find(k => /fnafw1/i.test(k) && (localStorage.getItem(k) || '').length > 10);
            if (slot1) return slot1;
            return keys.sort((a, b) => (localStorage.getItem(b) || '').length - (localStorage.getItem(a) || '').length);
        }



        function editIniValue(ini, keyName, val, add = true) {
            const rx = new RegExp(`^(${keyName}\\s*=\\s*)(-?\\d+)`, 'mi');
            if (rx.test(ini)) {
                return ini.replace(rx, (_, p, n) => p + (add ? parseInt(n, 10) + val : val));
            }
            // Insert under [fnafw] header if present, otherwise append
            if (/^\[fnafw\]/mi.test(ini)) {
                return ini.replace(/^(\[fnafw\]\s*)/mi, `$1\n${keyName}=${val}\n`);
            }
            return ini.trim() + `\n${keyName}=${val}\n`;
        }

        function modAddTokens(amount) {
            const key = getActiveSaveKey();
            if (!key) return setModStatus('No save found! Walk in world first.', true);
            let ini = localStorage.getItem(key);
            ini = editIniValue(ini, 'tokens', amount, true);
            localStorage.setItem(key, ini);
            setModStatus(`+${amount} Faz Tokens added to ${key}! Reload save.`);
        }

        function modLevelUpParty(levels) {
            const key = getActiveSaveKey();
            if (!key) return setModStatus('No save found! Walk in world first.', true);
            let ini = localStorage.getItem(key);
            let count = 0;

            for (let slot = 1; slot <= 4; slot++) {
                // FNaF World INI uses s1=id..s4=id (or 1s=id..4s=id in some builds)
                const m = ini.match(new RegExp(`^(?:s${slot}|${slot}s)\\s*=\\s*(\\d+)`, 'mi'));
                if (m && parseInt(m[1], 10) > 0) {
                    const charId = parseInt(m[1], 10);
                    ini = editIniValue(ini, `${charId}LV`, levels, true);
                    count++;
                }
            }

            // Fallback: if party slot keys aren't written yet, level up all unlocked characters
            if (!count) {
                for (let id = 1; id <= 48; id++) {
                    if (new RegExp(`^${id}have\\s*=\\s*1`, 'mi').test(ini)) {
                        ini = editIniValue(ini, `${id}LV`, levels, true);
                        count++;
                    }
                }
            }

            if (!count) return setModStatus('No characters found! Win 1 battle first.', true);
            localStorage.setItem(key, ini);
            setModStatus(`+${levels} Lvls added (${count} chars)! Reload save.`);
        }

        function modUnlockAllChars() {
            const key = getActiveSaveKey();
            if (!key) return setModStatus('No save found! Walk in world first.', true);
            let ini = localStorage.getItem(key);
            for (let id = 1; id <= 48; id++) {
                ini = editIniValue(ini, `${id}have`, 1, false);
            }
            localStorage.setItem(key, ini);
            setModStatus('All 48 characters unlocked! Reload save.');
        }

        function modMaxArmor() {
            const key = getActiveSaveKey();
            if (!key) return setModStatus('No save found! Walk in world first.', true);
            let ini = localStorage.getItem(key);
            ini = editIniValue(ini, 'armor', 5, false);
            localStorage.setItem(key, ini);
            setModStatus('Max Endo Upgrade equipped! Reload save.');
        }

        function modToggleHardMode() {
            const key = getActiveSaveKey();
            if (!key) return setModStatus('No save found! Walk in world first.', true);
            let ini = localStorage.getItem(key);
            const isHard = /^hard\s*=\s*1/mi.test(ini);
            const nextVal = isHard ? 0 : 1;
            ini = editIniValue(ini, 'hard', nextVal, false);
            localStorage.setItem(key, ini);
            setModStatus(`Switched to ${nextVal ? 'Hard Mode' : 'Normal Mode'}! Reload save.`);
        }


        // --- FAST LOADER & INDEXEDDB CACHE ---
        function openAssetDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('fnafw-unpacked-v1', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('files');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadFromDB(db) {
            return new Promise((resolve) => {
                const tx = db.transaction('files', 'readonly');
                const store = tx.objectStore('files');
                const keysReq = store.getAllKeys();
                const valsReq = store.getAll();
                tx.oncomplete = () => {
                    if (!keysReq.result.length) return resolve(null);
                    const map = new Map();
                    keysReq.result.forEach((k, i) => map.set(k, URL.createObjectURL(valsReq.result[i])));
                    resolve(map);
                };
                tx.onerror = () => resolve(null);
            });
        }

        async function saveToDB(db, entries) {
            return new Promise((resolve) => {
                const tx = db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                for (const [name, blob] of entries) store.put(blob, name);
                tx.oncomplete = resolve;
                tx.onerror = resolve;
            });
        }

        window.onload = async function () {
            const pctEl = document.getElementById('percentage');
            let lastPct = -1;
            function setPct(p) {
                const c = Math.min(100, Math.max(0, Math.floor(p)));
                if (c !== lastPct) {
                    lastPct = c;
                    pctEl.textContent = c + '%';
                    document.title = c + '% ' + gametitle;
                }
            }

            const db = await openAssetDB().catch(() => null);
            let map = db ? await loadFromDB(db) : null;

            if (!map) {
                map = new Map();
                const rawEntries = [];
                let done = 0;

                const buffers = await Promise.all(
                    Array.from({ length: parts }, (_, i) =>
                        fetch(`src/resources.zip.part${i + 1}`)
                            .then(r => r.arrayBuffer())
                            .then(b => { setPct((++done / parts) * 50); return b; })
                    )
                );

                const zip = await JSZip.loadAsync(await new Blob(buffers).arrayBuffer());
                const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
                let unzipped = 0;

                for (let i = 0; i < names.length; i += 60) {
                    await Promise.all(names.slice(i, i + 60).map(async name => {
                        const blob = await zip.files[name].async('blob');
                        map.set(name, URL.createObjectURL(blob));
                        rawEntries.push([name, blob]);
                        unzipped++;
                    }));
                    setPct(50 + (unzipped / names.length) * 50);
                }

                if (db) await saveToDB(db, rawEntries);
            } else {
                setPct(100);
            }

            const ogfetch = window.fetch;
            window.fetch = (input, init) => {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const f = input.split('/').pop();
                    if (map.has(f)) return ogfetch(map.get(f), init);
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (typeof url === 'string' && url.startsWith('resources/')) {
                    const f = url.split('/').pop();
                    if (map.has(f)) url = map.get(f);
                }
                return ogopen.apply(this, arguments);
            };

            for (const Tag of [HTMLImageElement, HTMLAudioElement, HTMLVideoElement]) {
const desc = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
if (desc && desc.set) {
Object.defineProperty(Tag.prototype, 'src', {
configurable: true,
enumerable: true,
get: desc.get,
set(val) {
if (typeof val === 'string' && val.startsWith('resources/')) {
const f = val.split('/').pop();
if (map.has(f)) val = map.get(f);
}
desc.set.call(this, val);
}
});
}
}
const script = document.createElement('script');
script.src = 'src/Runtime.js';
script.onload = () => new Runtime('MMFCanvas', runtimecanvas);
document.getElementById('MMFCanvas').style.display = 'block';
document.getElementById('selection').style.display = 'none';
document.title = gametitle;
document.head.appendChild(script);
};

</script>
</body>
</html>
